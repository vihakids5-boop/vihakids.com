<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="Vihakids — Online Tuitions, Bengaluru, India">
  <!-- Horizontal lockup: mark + wordmark + tagline.
       Colours are the site's own tokens (app/frontend/src/styles/tokens.css):
         brand green  marigold     #3E9767
         wordmark     ink          #34201A
         tagline      ink-soft     #5C463D
         cream        paper-raised #FFFCF4
       Type is Montserrat, the face the site already loads, matching the
       .brand-word (700) and .brand-tagline (600, wide tracking) rules.
       The wordmark is live text rather than outlines, so it stays editable and
       crisp; a viewer without Montserrat falls back to the stack below. -->
  <g>
    <rect x="0" y="6" width="128" height="128" rx="30" fill="#3E9767"/>
    <path d="M38 46 L64 100 L90 46" fill="none" stroke="#FFFCF4" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="156" y="80" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-0.5" fill="#34201A">
    <tspan fill="#3E9767">V</tspan>ihakids
  </text>

  <text x="159" y="110" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" letter-spacing="1.9" fill="#5C463D">ONLINE TUITIONS · BENGALURU, INDIA</text>
</svg>
