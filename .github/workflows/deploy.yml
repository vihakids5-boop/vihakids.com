name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::483528439529:role/github-actions-vihakids-deploy
          aws-region: ap-south-1
          role-skip-session-tagging: true

      # No --delete: the React app's prerendered route files (faq, fees,
      # kannada-online-tuition, about.html, ...) are uploaded to the bucket root by
      # the frontend deploy and do not exist in this repo's root. With --delete,
      # every push to main wiped them, and CloudFront then served the homepage
      # HTML (canonical "/") for every route.
      - name: Sync site files to S3
        run: |
          aws s3 sync . s3://www.vihakids.com/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude ".gitignore" \
            --exclude "REGISTRATION-SETUP.md" \
            --exclude "firestore.rules" \
            --exclude "social-media/*" \
            --exclude "app/*" \
            --exclude ".DS_Store" \
            --exclude "index.html" \
            --exclude "assets/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2PJCWK969DJ60 \
            --paths "/*"
