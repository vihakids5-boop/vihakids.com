<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Vihakids">
  <!-- Icon-only mark: pure shapes, no text, so it renders identically everywhere.
       Colours are the site tokens: brand green #3E9767 on cream #FFFCF4.
       Deliberately one shape only. An earlier version had an open-book curve under
       the V; at 16px the curve and the V merged into a smudge, so it is gone and
       the V is heavier instead. A favicon has room for exactly one idea. -->
  <rect width="128" height="128" rx="30" fill="#3E9767"/>
  <path d="M38 40 L64 94 L90 40" fill="none" stroke="#FFFCF4" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
